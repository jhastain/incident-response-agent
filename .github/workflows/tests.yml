name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Unresolvable on purpose: app/config.py requires these, and no unit test
      # may reach a real gateway. A stray network call must fail with an
      # unresolvable name rather than succeed against something live.
      - name: Unit tests
        env:
          BIFROST_MCP_URL: https://gateway.invalid/mcp
          BIFROST_LLM_URL: https://gateway.invalid/v1
        run: uv run pytest tests/unit -q

      - name: End-to-end check
        env:
          BIFROST_MCP_URL: https://gateway.invalid/mcp
          BIFROST_LLM_URL: https://gateway.invalid/v1
        run: uv run python bin/e2e.py

  lint:
    runs-on: ubuntu-latest
    # Advisory, not a gate. This code carries ~70 pre-existing ruff findings
    # that its original pipeline never checked for; fixing them is a separate
    # change from publishing it. Failing the build on them would just mean a
    # permanently red badge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with ruff ruff check . --output-format=concise
